# V0.3 safe defaults. Copy to config.ini, then calibrate in a ground mission.
# No device connection is made in mock mode.
[ROI]
outer_x1 = 108
outer_y1 = 994
outer_x2 = 299
outer_y2 = 1005
inner_x1 = 114
inner_y1 = 996
inner_x2 = 294
inner_y2 = 1003
bar_min_x = 114
bar_max_x = 294
cap_ignore_left = 4
cap_ignore_right = 4

[color_space]
analysis_space = lab

[features]
# v3 混合特征阈值（亮度×纹理惩罚后，分数 0-1）
# filled: 填充分均值 ~0.58~0.99（受伤~满血）
# empty:  空槽分均值 ~0.13~0.27（暗红~灰白条纹）
gray_filled_threshold = 0.38
gray_empty_threshold = 0.30

[health]
ema_alpha = 0.3
dead_zone_low = 0.0
dead_zone_high = 1.0
near_zero = 0.0

[filters]
edge_region_1 = 200, 0, 1720, 40, 1.0
edge_region_2 = 200, 1040, 1720, 1080, 1.0
edge_region_3 = 0, 200, 40, 880, 0.8
edge_region_4 = 1880, 200, 1920, 880, 0.8
red_threshold = 18
red_ratio_threshold = 0.45
cyan_threshold = 10
cyan_ratio_threshold = 0.30

[death]
health_near_zero = 0.0
red_extreme_ratio = 0.65
death_score_threshold = 0.7

[state_machine]
merge_window_sec = 0.2
debounce_frames = 2
unknown_alarm_frames = 30
injured_health_threshold = 0.75
healing_full_threshold = 0.95
healing_cyan_threshold = 0.30

[unknown]
min_confidence = 0.55
min_anchor_score = 0.50
min_structure_contrast = 8.0
red_no_anchor_threshold = 0.70

[trigger]
sender_mode = mock
injury_cooldown_sec = 0.0
death_cooldown_sec = 0.0
healing_cooldown_sec = 0.0
low_health_cooldown_sec = 3.0
# 原始 SPEC: 只有已确认有血到归零才触发，一次生命只触发一次。
death_hp_threshold = 0.0
injury_window_sec = 0.2
injury_delta_threshold = 0.0
healing_delta_threshold = 0.0
low_health_hp_threshold = 0.75
max_frame_gap_sec = 1.0
healing_sustain_sec = 2.0

[sender]
# 旧配置保持仅 A；桌面反馈设置可选 a / b / both。
channel_mode = a
# 波形字段为 <事件>_waveform；B 强度为 <事件>_strength_b，缺省继承 A。
# 新版桌面首次使用会写入官方连击/呼吸/潮汐和原治疗/死亡五种不同模板。
ws_host = 127.0.0.1
ws_port = 9999
injury_pulse_strength = 20
death_pulse_strength = 40
heal_pulse_strength = 15
low_health_strength = 10
healing_sustain_strength = 5
max_strength = 100
injury_pulse_duration = 2.0
heal_pulse_duration = 2.0
death_pulse_duration = 5.0

[debug]
enabled = 1
save_misjudge = 1
misjudge_path = debug/misjudge
overlay = 1
log_level = INFO

[calibration]
calibrated = 0
resolution = 1920x1080

[capture]
# mss 显示器编号 (1=主屏, 2=副屏)
monitor_index = 1

[dghub]
# DGHub 插件模式（sender_mode = dghub）
# 强度映射到 DGHub trigger delta_pct（相对 baseline 的增量百分比）
injury_strength = 20
death_strength = 40
heal_strength = 15
low_health_strength = 10
# 输出通道: a / b / both
channel = a
